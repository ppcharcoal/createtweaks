name: Build

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: World generation smoke test
        run: |
          mkdir -p run-smoke
          echo "eula=true" > run-smoke/eula.txt
          printf "online-mode=false\nlevel-seed=arcticfox\nspawn-protection=0\nmax-tick-time=-1\n" > run-smoke/server.properties
          timeout 1500 ./gradlew runSmokeTest --stacktrace 2>&1 | tee smoke.log || true
          echo "----- smoke test report -----"
          grep -E "ArcticFox/SMOKE|ERROR|Exception|Failed to|Couldn't" smoke.log | head -200 || true
          grep -q "ARCTICFOX SMOKETEST PASS" smoke.log

      - name: Compatibility smoke test (Create + Serene Seasons)
        run: |
          rm -rf run-smoke/world
          timeout 1500 ./gradlew runSmokeTest -PcompatMods --stacktrace 2>&1 | tee compat.log || true
          echo "----- compat report -----"
          grep -E "ArcticFox/SMOKE|ERROR|Exception" compat.log | head -200 || true
          grep -q "ARCTICFOX SMOKETEST PASS" compat.log

      - name: Upload smoke test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-log
          path: |
            smoke.log
            run-smoke/logs/latest.log
          if-no-files-found: ignore

      - name: Publish logs to ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/ci-logs
          cp build.log smoke.log compat.log /tmp/ci-logs/ 2>/dev/null || true
          cp run-smoke/logs/latest.log /tmp/ci-logs/server.log 2>/dev/null || true
          cd /tmp/ci-logs
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "${{ github.sha }} ${{ job.status }}" > STATUS
          git add -A && git commit -q -m "logs for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: arcticfox-jar
          path: build/libs/*.jar

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
