name: Build

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: World generation smoke test
        run: |
          mkdir -p run-smoke
          echo "eula=true" > run-smoke/eula.txt
          printf "online-mode=false\nlevel-seed=arcticfox\nspawn-protection=0\n" > run-smoke/server.properties
          timeout 1500 ./gradlew runSmokeTest --stacktrace 2>&1 | tee smoke.log || true
          echo "----- smoke test report -----"
          grep -E "ArcticFox/SMOKE|ERROR|Exception|Failed to|Couldn't" smoke.log | head -200 || true
          grep -q "ARCTICFOX SMOKETEST PASS" smoke.log

      - name: Upload smoke test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-log
          path: |
            smoke.log
            run-smoke/logs/latest.log
          if-no-files-found: ignore

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: arcticfox-jar
          path: build/libs/*.jar

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
