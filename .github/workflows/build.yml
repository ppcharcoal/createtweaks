name: Inspect
on:
  push:
    branches: [ 'inspect-cs' ]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Dump Cold Sweat API
        run: |
          set +e
          exec > >(tee /tmp/run.log) 2>&1
          chmod +x gradlew
          cat >> build.gradle <<'G'
          tasks.register('dumpCs') {
              doLast {
                  def f = configurations.compileClasspath.files.find { it.name.contains('cold-sweat') }
                  println "CSJAR=" + f
                  def out = layout.buildDirectory.file('csjar.txt').get().asFile; out.parentFile.mkdirs(); out.text = f.toString()
              }
          }
          G
          mkdir -p /tmp/out
          ./gradlew dumpCs --stacktrace
          JAR=$(cat build/csjar.txt)
          echo "JAR=$JAR" 
          unzip -l "$JAR" | grep -E "api/|temperature|modifier|Weather|weather" > /tmp/out/listing.txt || true
          for c in com.momosoftworks.coldsweat.api.temperature.modifier.TempModifier \
                   com.momosoftworks.coldsweat.api.util.Temperature \
                   com.momosoftworks.coldsweat.api.util.Temperature\$Trait \
                   com.momosoftworks.coldsweat.api.util.Placement \
                   com.momosoftworks.coldsweat.api.util.Placement\$Duplicates \
                   com.momosoftworks.coldsweat.api.event.core.registry.TempModifierRegisterEvent \
                   com.momosoftworks.coldsweat.api.event.common.temperautre.DefaultTempModifiersEvent \
                   com.momosoftworks.coldsweat.common.capability.temperature.AbstractTempCap ; do
            echo "=== $c" >> /tmp/out/javap.txt
            javap -cp "$JAR" -public "$c" >> /tmp/out/javap.txt 2>&1 || true
          done
          unzip -l "$JAR" | grep -iE "modifier/.*\.class" | awk '{print $4}' > /tmp/out/modifiers.txt
          unzip -l "$JAR" | grep -iE "event/.*\.class" | awk '{print $4}' > /tmp/out/events.txt
          for c in $(grep -iE "temp/modifier/(Weather|Biome|Elevation|Depth)" /tmp/out/modifiers.txt | sed 's/\.class$//; s#/#.#g'); do
            echo "=== $c" >> /tmp/out/javap.txt; javap -cp "$JAR" -p "$c" >> /tmp/out/javap.txt 2>&1 || true
          done
          cp /tmp/run.log /tmp/out/ || true
          cd /tmp/out && git init -q -b mod-dumps && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -qm "cold sweat dump" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" mod-dumps
