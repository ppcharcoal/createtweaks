name: Inspect mod jars
on: push
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Download and unpack
        run: |
          mkdir -p out && cd out
          get() {
            url=$(curl -s "https://api.modrinth.com/v2/version/$2" | jq -r '.files[0].url'); curl -sL "$url" -o "$1.jar"
            curl -s "https://api.modrinth.com/v2/version/$2" | jq '.dependencies' > "$1.deps.json"
            mkdir -p "$1"; (cd "$1" && unzip -q -o "../$1.jar" -x '*.class' '*.png' '*.ogg' 'assets/*/models/*' 'assets/*/geo/*' 'assets/*/animations/*' 'assets/*/blockstates/*' || true)
            unzip -l "$1.jar" | awk '{print $4}' > "$1.filelist.txt"
            mkdir -p cls && (cd cls && unzip -q -o "../$1.jar" '*onfig*.class' '*illager*.class' '*rofession*.class' '*Trade*.class' || true)
            find cls -name '*.class' | while read c; do echo "=== $c"; strings -n 3 "$c" | head -400; done > "$1.strings.txt" || true
            rm -rf cls "$1.jar"
          }
          get railways czVeSmZo
          du -sh .
      - name: Push dump
        run: |
          cd out
          git init -q -b mod-dumps
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m dump || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" mod-dumps
