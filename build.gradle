plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Boots a dedicated server, generates a world with the mod's worldgen,
        // prints terrain/biome statistics and shuts down. Used by CI.
        smokeTest {
            server()
            programArgument '--nogui'
            systemProperty 'arcticfox.smoketest', 'true'
            gameDirectory = project.file('run-smoke')
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // Cold Sweat's block temperature API (optional at runtime)
    compileOnly "maven.modrinth:cold-sweat:${cold_sweat_version}"

    // Only for the CI compatibility smoke test (./gradlew runSmokeTest -PcompatMods); never shipped.
    if (project.hasProperty('compatMods')) {
        runtimeOnly "maven.modrinth:create:${create_version}"
        runtimeOnly "maven.modrinth:serene-seasons:${serene_seasons_version}"
        runtimeOnly "maven.modrinth:glitchcore:${glitchcore_version}"
        runtimeOnly "maven.modrinth:slice-and-dice:${slice_and_dice_version}"
        runtimeOnly "maven.modrinth:ordsPcFz:${kotlin_for_forge_version}"
        runtimeOnly "maven.modrinth:cold-sweat:${cold_sweat_version}"
        runtimeOnly "maven.modrinth:snow-real-magic:${snow_real_magic_version}"
        runtimeOnly "maven.modrinth:ufdDoWPd:${kiwi_version}"
        runtimeOnly "maven.modrinth:mowzies-mobs:${mowzies_mobs_version}"
        runtimeOnly "maven.modrinth:8BmcQJ2H:${geckolib_version}"
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
